x-logging: &logging
  driver: local

services:
  composery:
    image: ghcr.io/sloikodavid/composery:latest
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 1m
    env_file: ./composery.env
    environment:
      - COMPOSERY_INIT=systemd
    privileged: true
    cgroup: host
    stop_signal: SIGRTMIN+3
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - composery_data:/data
    ports:
      - "8080:8080"
      # SSH. Uncomment to reach this instance with ssh, scp, rsync, or a desktop
      # editor's remote mode. 2222 on the left because your own server already
      # uses 22; the right side is always 22 inside the container. Add a key with
      # COMPOSERY_SSH_AUTHORIZED_KEYS, or from the editor once you are signed in.
      # - "2222:22"

volumes:
  composery_data:
