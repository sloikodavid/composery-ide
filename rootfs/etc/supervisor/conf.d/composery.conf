[program:persistence]
command=/opt/composery/bin/composery persistence daemon
user=root
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ide]
command=/opt/composery/ide.sh
user=user
environment=HOME="/home/user",USER="user",LOGNAME="user",SHELL="/bin/bash"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:caddy]
command=/usr/local/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
user=user
environment=HOME="/home/user",XDG_CONFIG_HOME="/run/caddy/config",XDG_DATA_HOME="/run/caddy/data"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Exit 78 is ssh.sh refusing to run (COMPOSERY_DISABLE_SSH), which is a decision
# and not a fault - listing it here is what keeps supervisor from restarting it
# forever. sshd listens inside the container; nothing reaches it until the
# deployment publishes the port.
[program:ssh]
command=/opt/composery/ssh.sh daemon
user=root
autorestart=unexpected
exitcodes=78
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# containerd before docker: dockerd is pointed at this one's socket rather than
# starting a private child, so the shipped /etc/containerd/config.toml is what
# decides where image layers land. Exit 78 is docker.sh refusing to run (no
# CAP_SYS_ADMIN, or COMPOSERY_DISABLE_DOCKER), which is a decision and not a
# fault - listing it here is what keeps supervisor from restarting it forever.
[program:containerd]
command=/opt/composery/docker.sh containerd
user=root
autorestart=unexpected
exitcodes=78
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:docker]
command=/opt/composery/docker.sh dockerd
user=root
autorestart=unexpected
exitcodes=78
priority=6
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# supervisor has no init, so run cron in the foreground (systemd uses its unit).
[program:cron]
command=/usr/sbin/cron -f
user=root
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:watchdog]
command=/opt/composery/watchdog.sh
user=root
autorestart=true
priority=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
