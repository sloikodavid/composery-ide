# See containerd.service.d/composery.conf. Docker's own unit already starts
# dockerd with --containerd=/run/containerd/containerd.sock, so the systemd
# profile needs no equivalent of the flag docker.sh passes under supervisor.
[Service]
# systemd starts units with a clean environment; without this the gate cannot see
# COMPOSERY_DISABLE_DOCKER and would run Docker on an instance configured without it.
EnvironmentFile=-/run/composery.env
ExecCondition=/opt/composery/docker.sh check
