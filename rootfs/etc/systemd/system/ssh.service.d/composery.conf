# Composery gates SSH on one decision, shared with the supervisor profile, and
# generates the host keys before sshd looks for them. ExecCondition is the systemd
# primitive for the gate: a non-zero exit leaves the unit inactive rather than
# marking it failed and retrying.
[Service]
# systemd starts units with a clean environment, so the gate would never see
# COMPOSERY_DISABLE_SSH without this - it would read as unset and SSH would run
# on an instance configured to have none.
EnvironmentFile=-/run/composery.env
ExecCondition=/opt/composery/ssh.sh check
# The empty assignment is load-bearing: systemd *accumulates* ExecStartPre, base
# unit first and drop-ins after, so without it Debian's own
# `ExecStartPre=/usr/sbin/sshd -t` runs before the step that generates the host
# keys. The image ships none on purpose (the Dockerfile deletes the pair Debian's
# postinst makes, so an instance's identity is made on the instance and never
# shipped), so on a first boot `sshd -t` found no host keys, exited 1, and the
# unit hit its restart limit without ever starting. Clearing the list and
# restating both in a sensible order is the fix.
#
# This only ever bit the systemd profile. Under supervisor, `ssh.sh daemon` runs
# `prepare` itself before exec'ing sshd, so the ordering never arose - which is
# why it was invisible on Composery Cloud, which defaults to supervisor, and hit
# only self-hosters using the systemd templates.
#
# `sshd -t` is kept rather than dropped. Validating the configuration before
# starting is worth having; it simply has to come after the keys it validates
# against exist.
ExecStartPre=
ExecStartPre=/opt/composery/ssh.sh prepare
ExecStartPre=/usr/sbin/sshd -t
