# Composery's SSH service.
#
# Debian's sshd_config includes this directory from its first line and sshd keeps
# the first value it sees for a keyword, so everything here wins over the packaged
# defaults further down that file.

# Keys only. An instance's password is an argon2 hash for the web session; there
# is no Unix password to offer, and a public port with password authentication is
# a brute-force surface with nothing to gain from defending it.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no

# One account, the same one the editor's terminal runs as, so a file looks
# identical over SSH and in the IDE. Root is reached the ordinary way, by sudo.
AllowUsers user

# Certificates signed by this instance's own authority (see ssh.sh). Every issued
# certificate carries a serial, and revoking one writes that serial into the KRL -
# which is how a single device or agent loses access without touching any other.
# A KRL revokes the certificate alone; naming a certificate in RevokedKeys
# directly would revoke the underlying key as well, so the list is always a KRL.
TrustedUserCAKeys /etc/ssh/composery_ca.pub
RevokedKeys /data/ssh/krl

# This instance's host certificate, signed by the same authority. A client that
# trusts the CA verifies the host by signature instead of a pinned fingerprint, so
# a rebuilt instance does not look like an attack.
HostCertificate /etc/ssh/ssh_host_ed25519_key-cert.pub

# Deployment-supplied keys live outside the account's own file. An owner editing
# ~/.ssh/authorized_keys can then never clobber what the deployment set, and
# COMPOSERY_SSH_AUTHORIZED_KEYS can never rewrite what the owner added - two
# writers, two files, no merge to get wrong.
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys.d/%u

# Forwarding stays on. The owner is root on this machine and could tunnel with or
# without our permission, so refusing would be cautious rather than true - and
# -L, -R and -D are most of what makes an instance usable as an ordinary server.
AllowTcpForwarding yes
AllowAgentForwarding yes

# Remote forwards stay bound to loopback unless the client asks per-port. Opening
# every -R to the public interface by default is a decision the owner should make
# deliberately, not one inherited from us.
GatewayPorts no

ClientAliveInterval 30
ClientAliveCountMax 6
