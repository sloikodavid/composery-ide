<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Colors</title>
		<link rel="stylesheet" href="/codicon.css" />
		<style>
			* {
				box-sizing: border-box;
			}
			:root {
				font:
					13px/1.45 Inter,
					ui-sans-serif,
					system-ui,
					sans-serif;
				background: var(--background);
				color: var(--foreground);
			}
			body {
				display: flex;
				flex-direction: column;
				height: 100vh;
				margin: 0;
			}
			button,
			input {
				font: inherit;
			}
			input[type="checkbox"] {
				width: 14px;
				height: 14px;
				accent-color: var(--foreground);
			}
			button {
				color: inherit;
			}
			.icon {
				display: block;
				width: 1em;
				height: 1em;
				flex: 0 0 auto;
				fill: none;
				stroke: currentColor;
				stroke-width: 2;
				stroke-linecap: round;
				stroke-linejoin: round;
			}
			.icon-only {
				display: inline-grid;
				place-items: center;
				line-height: 0;
			}
			.with-icon {
				display: inline-flex;
				align-items: center;
				gap: 6px;
			}
			.toolbar {
				flex-wrap: wrap;
				position: sticky;
				top: 0;
				z-index: 10;
				display: flex;
				min-height: 54px;
				align-items: center;
				gap: 16px;
				padding: 8px 14px;
				border-bottom: 1px solid var(--border);
				background: var(--muted);
			}
			h1 {
				margin: 0 auto 0 0;
				font-size: 16px;
				font-weight: 650;
			}
			.segment {
				display: flex;
				gap: 2px;
				padding: 3px;
				border: 1px solid var(--border);
				border-radius: 8px;
				background: var(--background);
			}
			.segment button,
			.primary {
				min-height: 30px;
				padding: 5px 10px;
				border: 0;
				border-radius: 5px;
				background: transparent;
				cursor: pointer;
			}
			.history {
				display: flex;
				gap: 2px;
			}
			.history button {
				display: grid;
				min-width: 30px;
				min-height: 30px;
				place-items: center;
				padding: 0;
				border: 0;
				border-radius: 5px;
				background: transparent;
				color: var(--muted-foreground);
				cursor: pointer;
				font-size: 15px;
			}
			.history button:hover:not(:disabled) {
				background: var(--selected);
				color: var(--foreground);
			}
			.history button:disabled {
				cursor: default;
				opacity: 0.35;
			}
			.segment button[aria-pressed="true"] {
				background: var(--selected);
				color: var(--selected-foreground);
				box-shadow: 0 0 0 1px var(--border);
			}
			.primary {
				min-width: 64px;
				background: var(--button);
				color: var(--button-foreground);
				font-weight: 650;
			}
			.primary:disabled {
				cursor: default;
				opacity: 0.45;
			}
			.layout {
				display: grid;
				grid-template-columns: 480px minmax(640px, 1fr);
				flex: 1;
				min-height: 0;
			}
			.controls {
				overflow: auto;
				scrollbar-gutter: stable;
				padding: 16px 14px;
				border-right: 1px solid var(--border);
				background: var(--muted);
			}
			.group + .group {
				margin-top: 22px;
			}
			.group h2 {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 8px;
				margin: 0 0 7px;
				color: var(--muted-foreground);
				font-size: 11px;
				font-weight: 650;
				letter-spacing: 0.06em;
				text-transform: uppercase;
			}
			.role {
				display: grid;
				grid-template-columns: minmax(0, 1fr) 26px 34px 94px 26px 22px;
				align-items: center;
				gap: 6px;
				min-height: 34px;
			}
			.feature-row {
				display: grid;
				grid-template-columns: minmax(0, 1fr) auto;
				align-items: center;
				gap: 12px;
				min-height: 42px;
			}
			.feature-copy {
				min-width: 0;
			}
			.feature-copy b,
			.feature-copy small {
				display: block;
			}
			.feature-copy b {
				font-size: 12px;
				font-weight: 600;
			}
			.feature-copy small {
				overflow: hidden;
				color: var(--muted-foreground);
				font-size: 10px;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			input.feature-switch {
				width: 34px;
				height: 20px;
				margin: 0;
				appearance: none;
				border: 1px solid var(--border);
				border-radius: 999px;
				background:
					radial-gradient(
						circle at 9px 50%,
						var(--muted-foreground) 0 6px,
						transparent 6.5px
					),
					var(--muted);
				cursor: pointer;
			}
			input.feature-switch:checked {
				background:
					radial-gradient(
						circle at 25px 50%,
						var(--button-foreground) 0 6px,
						transparent 6.5px
					),
					var(--button);
			}
			.role[hidden],
			.group[hidden] {
				display: none;
			}
			.area {
				border: 1px solid var(--border);
				border-radius: 8px;
				color: var(--muted-foreground);
				font-size: 9px;
				font-weight: 650;
				letter-spacing: 0.03em;
				text-align: center;
			}
			.link {
				position: relative;
				display: grid;
				width: 26px;
				height: 22px;
				place-items: center;
				padding: 0;
				border: 0;
				border-radius: 5px;
				background: transparent;
				color: var(--muted-foreground);
				cursor: pointer;
				font-size: 11px;
			}
			.link .icon,
			.reset .icon {
				width: 14px;
				height: 14px;
			}
			.link-count {
				position: absolute;
				right: -2px;
				bottom: -2px;
				display: grid;
				min-width: 12px;
				height: 12px;
				place-items: center;
				padding: 0 2px;
				border: 1px solid var(--muted);
				border-radius: 999px;
				background: var(--foreground);
				color: var(--background);
				font-size: 8px;
				font-weight: 700;
				line-height: 1;
			}
			.link:hover {
				background: var(--selected);
				color: var(--foreground);
			}
			.link.loose {
				color: var(--destructive);
			}
			.filter {
				display: flex;
				align-items: center;
				gap: 6px;
				color: var(--muted-foreground);
			}
			.plain {
				min-height: 30px;
				padding: 5px 10px;
				border: 1px solid var(--border);
				border-radius: 5px;
				background: transparent;
				cursor: pointer;
			}
			.plain:hover:not(:disabled) {
				background: var(--selected);
			}
			.plain:disabled {
				cursor: default;
				opacity: 0.45;
			}
			#transfer {
				width: min(680px, 90vw);
				padding: 16px;
				border: 1px solid var(--border);
				border-radius: 10px;
				background: var(--popover);
				color: var(--popover-foreground);
			}
			#transfer::backdrop {
				background: var(--overlay);
			}
			#transfer h2 {
				margin: 0 0 10px;
				font-size: 14px;
			}
			#transfer-text {
				width: 100%;
				height: 46vh;
				padding: 10px;
				border: 1px solid var(--field-border);
				border-radius: 6px;
				outline: none;
				background: var(--background);
				color: var(--foreground);
				font:
					12px/1.5 ui-monospace,
					"SFMono-Regular",
					Consolas,
					monospace;
				resize: vertical;
			}
			#transfer-status {
				min-height: 20px;
				margin: 8px 0 0;
				color: var(--muted-foreground);
			}
			#transfer-status.error {
				color: var(--destructive);
			}
			.transfer-actions {
				display: flex;
				justify-content: flex-end;
				gap: 8px;
				margin-top: 10px;
			}
			.role-name {
				overflow: hidden;
				color: var(--foreground);
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.swatch {
				width: 34px;
				height: 26px;
				padding: 0;
				border: 1px solid var(--border);
				border-radius: 5px;
				cursor: pointer;
			}
			.reset {
				display: grid;
				width: 22px;
				height: 22px;
				place-items: center;
				padding: 0;
				border: 0;
				border-radius: 5px;
				background: transparent;
				color: var(--muted-foreground);
				cursor: pointer;
				font-size: 14px;
			}
			.reset:hover:not(:disabled) {
				background: var(--selected);
				color: var(--foreground);
			}
			.reset:disabled {
				cursor: default;
				opacity: 0.35;
			}

			/* Hex-first picker: the native one opens in RGB and cannot be told otherwise. */
			#picker {
				position: fixed;
				inset: auto;
				width: 264px;
				margin: 0;
				padding: 12px;
				border: 1px solid var(--border);
				border-radius: 8px;
				background: var(--popover);
				color: var(--popover-foreground);
				box-shadow: 0 14px 40px
					color-mix(in srgb, var(--overlay) 65%, transparent);
			}
			#picker .sv {
				position: relative;
				height: 176px;
				border-radius: 5px;
				cursor: crosshair;
				touch-action: none;
			}
			#picker .sv i {
				position: absolute;
				width: 16px;
				height: 16px;
				border: 2px solid #ffffff;
				border-radius: 50%;
				box-shadow: 0 0 0 1px #00000080;
				pointer-events: none;
				translate: -50% -50%;
			}
			#picker input[type="range"] {
				width: 100%;
				height: 18px;
				margin: 12px 0 0;
				appearance: none;
				border-radius: 9px;
			}
			#picker input[type="range"]::-webkit-slider-thumb {
				width: 18px;
				height: 18px;
				appearance: none;
				border: 3px solid #ffffff;
				border-radius: 50%;
				box-shadow: 0 0 0 1px #00000080;
			}
			#picker input[type="text"] {
				width: 100%;
				height: 32px;
				margin-top: 12px;
				font-size: 14px;
				text-align: center;
			}
			input[type="text"] {
				width: 94px;
				height: 27px;
				padding: 3px 6px;
				border: 1px solid var(--field-border);
				border-radius: 5px;
				outline: none;
				background: var(--background);
				color: var(--foreground);
				font:
					12px/1.2 ui-monospace,
					"SFMono-Regular",
					Consolas,
					monospace;
			}
			input[type="text"]:focus {
				border-color: var(--ring);
			}
			input[type="text"].invalid {
				border-color: var(--destructive);
				color: var(--destructive);
			}
			#status {
				min-height: 20px;
				margin: 16px 0 0;
				color: var(--muted-foreground);
			}
			#status.error {
				color: var(--destructive);
			}
			.stage {
				display: grid;
				grid-template-rows: auto minmax(0, 1fr);
				min-width: 0;
				overflow: hidden;
				padding: 24px;
				background: var(--background);
			}
			/* Product previews. Their geometry and states follow the shipped web
			   components and captured Composery workbench.
			   data-token on the matching markup is the source of truth for locating
			   a role and for the invariant that every editable role is visible. */
			.preview-bar {
				display: flex;
				align-items: center;
				gap: 10px;
				min-width: 0;
				margin-bottom: 10px;
			}
			.preview-tabs {
				display: flex;
				flex-wrap: wrap;
				gap: 3px;
				padding: 3px;
				border: 1px solid var(--border);
				border-radius: 8px;
				background: var(--muted);
			}
			.preview-tabs button {
				min-height: 27px;
				padding: 4px 9px;
				border: 0;
				border-radius: 5px;
				background: transparent;
				color: var(--muted-foreground);
				cursor: pointer;
			}
			.preview-tabs button[aria-pressed="true"] {
				background: var(--background);
				color: var(--foreground);
				box-shadow: 0 0 0 1px var(--border);
			}
			.preview-summary {
				overflow: hidden;
				margin-left: auto;
				color: var(--muted-foreground);
				font-size: 11px;
				text-align: right;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.preview-frame {
				position: relative;
				min-width: 0;
				min-height: 0;
				height: 100%;
			}
			.product-preview {
				position: relative;
				width: 100%;
				height: 100%;
				min-height: 0;
				overflow: hidden;
				border: 1px solid var(--border);
				border-radius: 10px;
				box-shadow: 0 18px 55px
					color-mix(in srgb, var(--overlay) 45%, transparent);
			}
			[data-token].token-hit {
				position: relative;
				z-index: 2;
				outline: 2px solid var(--ring);
				outline-offset: 2px;
				box-shadow: 0 0 0 5px color-mix(in srgb, var(--ring) 20%, transparent);
			}
			.web-chart path.token-hit {
				stroke-width: 8px;
				filter: drop-shadow(0 0 4px var(--ring));
			}
			.role.active {
				border-radius: 5px;
				background: var(--selected);
				box-shadow: 0 0 0 3px var(--selected);
			}
			.role-name {
				min-width: 0;
				padding: 0;
				border: 0;
				background: transparent;
				text-align: left;
				cursor: pointer;
			}

			/* Website: the real floating header, PageTemplate spacing, 2xl cards,
			   compact controls, box rows, monitor, popover, toast, and dialog. */
			.web-product {
				display: flex;
				flex-direction: column;
				background: var(--background);
				color: var(--foreground);
				font:
					13px/1.45 -apple-system,
					BlinkMacSystemFont,
					Inter,
					"Segoe UI",
					sans-serif;
				letter-spacing: -0.009em;
			}
			.web-header {
				display: grid;
				grid-template-columns: 1fr auto 1fr;
				width: calc(100% - 28px);
				max-width: 900px;
				height: 52px;
				align-items: center;
				gap: 16px;
				margin: 0 auto;
				padding: 0 11px 0 9px;
				border: 1px solid var(--border);
				border-top: 0;
				border-radius: 0 0 16px 16px;
				background: var(--header);
				color: var(--header-foreground);
				box-shadow: 0 2px 8px var(--shadow);
			}
			.product-logo {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				justify-self: start;
				padding: 0;
				border: 0;
				background: transparent;
				color: inherit;
				cursor: pointer;
				font-size: 15px;
				font-weight: 700;
				letter-spacing: -0.025em;
			}
			.product-logo svg {
				width: 22px;
				height: 22px;
				overflow: visible;
			}
			.product-mark {
				display: inline-block;
				width: 22px;
				height: 22px;
				flex: 0 0 auto;
				background: currentColor;
				mask: url("/icon.svg") center/contain no-repeat;
			}
			.web-nav {
				display: flex;
				gap: 2px;
			}
			.web-nav button {
				height: 30px;
				padding: 0 10px;
				border: 0;
				border-radius: 999px;
				background: transparent;
				color: var(--muted-foreground);
				cursor: pointer;
			}
			.web-nav button:hover {
				background: var(--hover);
				color: var(--foreground);
			}
			.web-nav button.current {
				background: var(--selected);
				color: var(--selected-foreground);
			}
			.web-account {
				display: flex;
				align-items: center;
				justify-content: end;
				gap: 7px;
			}
			.web-icon-button,
			.web-button {
				display: inline-flex;
				height: 30px;
				align-items: center;
				justify-content: center;
				gap: 6px;
				padding: 0 11px;
				border: 1px solid transparent;
				border-radius: 999px;
				background: transparent;
				color: inherit;
				cursor: pointer;
				font: inherit;
				font-weight: 600;
				white-space: nowrap;
			}
			.web-icon-button {
				width: 30px;
				padding: 0;
				border-color: var(--border);
				background: var(--button);
				color: var(--button-foreground);
				font-size: 15px;
			}
			.web-icon-button .icon {
				width: 15px;
				height: 15px;
			}
			.web-button.primary-action,
			.web-button.outline-action {
				background: var(--button);
				color: var(--button-foreground);
			}
			.web-button.primary-action {
				background: var(--primary-button);
				color: var(--primary-button-foreground);
			}
			.web-button.outline-action {
				background: var(--outline-button);
				color: var(--button-foreground);
				border-color: var(--border);
			}
			.web-button.primary-action:hover,
			.web-icon-button:hover {
				background: var(--button-hover);
			}
			.web-button.outline-action:hover {
				background: var(--outline-button-hover);
			}
			.web-button.primary-action:hover {
				background: var(--primary-button-hover);
			}
			.web-button.primary-action:active,
			.web-icon-button:active {
				background: var(--button-active);
			}
			.web-button.outline-action:active {
				background: var(--outline-button-active);
			}
			.web-button.primary-action:active {
				background: var(--primary-button-active);
			}
			.web-button.pressed,
			.web-icon-button.pressed {
				background: var(--focus);
			}
			.web-button.secondary-action {
				background: var(--secondary-button);
				color: var(--secondary-button-foreground);
			}
			.web-button.secondary-action:hover,
			.monitor-select:hover {
				background: var(--secondary-button-hover);
			}
			.web-button.secondary-action:active,
			.monitor-select:active {
				background: var(--secondary-button-active);
			}
			.web-button.destructive-action {
				background: color-mix(in srgb, var(--destructive) 12%, transparent);
				color: var(--destructive);
			}
			.web-content {
				flex: 1;
				min-height: 0;
				overflow: auto;
				padding: 22px 20px;
				scrollbar-color: var(--scrollbar) var(--scrollbar-track);
			}
			.web-content::-webkit-scrollbar {
				width: 10px;
			}
			.web-content::-webkit-scrollbar-track {
				background: var(--scrollbar-track);
			}
			.web-content::-webkit-scrollbar-thumb {
				border: 2px solid var(--scrollbar-track);
				border-radius: 999px;
				background: var(--scrollbar);
			}
			.web-content::-webkit-scrollbar-thumb:hover {
				background: var(--scrollbar-hover);
			}
			.web-content::-webkit-scrollbar-thumb:active {
				background: var(--scrollbar-active);
			}
			.web-content::-webkit-scrollbar-corner,
			.web-content::-webkit-resizer {
				background: var(--scrollbar-track);
			}
			.web-product ::selection {
				background: var(--selection);
			}
			.web-footer {
				display: flex;
				min-height: 38px;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
				padding: 0 22px;
				border-top: 1px solid var(--border);
				background: var(--footer);
				color: var(--footer-foreground);
				font-size: 11px;
			}
			.web-footer nav {
				display: flex;
				gap: 14px;
			}
			.web-page {
				width: 100%;
				max-width: 760px;
				margin: 0 auto;
			}
			.web-page-head {
				display: flex;
				min-height: 30px;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
				margin-bottom: 13px;
			}
			.web-crumbs {
				display: flex;
				align-items: center;
				gap: 6px;
				font-size: 16px;
				font-weight: 550;
				letter-spacing: -0.025em;
			}
			.web-crumbs .icon {
				width: 16px;
				height: 16px;
			}
			.web-crumbs .past,
			.web-copy {
				color: var(--muted-foreground);
			}
			.web-crumbs button.past {
				display: inline-flex;
				align-items: center;
				gap: 5px;
				padding: 0;
				border: 0;
				background: transparent;
				font: inherit;
			}
			.web-card {
				overflow: hidden;
				border: 1px solid var(--border);
				border-radius: 16px;
				background: var(--card);
				color: var(--card-foreground);
				box-shadow: 0 1px 3px var(--shadow);
			}
			.web-docs {
				display: grid;
				width: min(920px, 100%);
				min-height: 100%;
				grid-template-columns: 190px minmax(0, 1fr);
				margin: -22px auto;
			}
			.web-sidebar {
				padding: 24px 14px;
				border-right: 1px solid var(--border);
				background: var(--sidebar);
				color: var(--sidebar-foreground);
			}
			.web-sidebar strong {
				display: block;
				margin: 0 8px 10px;
				font-size: 11px;
				letter-spacing: 0.05em;
				text-transform: uppercase;
			}
			.web-sidebar div {
				padding: 7px 8px;
				border-radius: 8px;
			}
			.web-sidebar .current {
				background: var(--selected);
				color: var(--selected-foreground);
			}
			.web-doc {
				max-width: 620px;
				padding: 30px 36px;
			}
			.web-doc h2 {
				margin: 0 0 8px;
				font-size: 25px;
			}
			.web-doc h3 {
				margin: 24px 0 8px;
			}
			.web-doc-callout {
				margin-top: 18px;
				padding: 13px 15px;
				border: 1px solid var(--border);
				border-radius: 12px;
				background: var(--card);
				color: var(--card-foreground);
				box-shadow: 0 1px 3px var(--shadow);
			}
			.web-browser-colors {
				display: grid;
				grid-template-columns: 1fr 12px;
				gap: 14px;
				margin-top: 20px;
				padding: 12px;
				border: 1px solid var(--border);
				border-radius: 12px;
			}
			.web-selection-sample {
				align-self: center;
				padding: 2px 4px;
				background: var(--selection);
			}
			.web-scrollbar-sample {
				position: relative;
				min-height: 76px;
				border-radius: 999px;
				background: var(--scrollbar-track);
			}
			.web-scrollbar-sample::before,
			.web-scrollbar-sample::after,
			.web-scrollbar-sample i {
				position: absolute;
				right: 2px;
				left: 2px;
				border-radius: 999px;
				content: "";
			}
			.web-scrollbar-sample::before {
				top: 5px;
				height: 23px;
				background: var(--scrollbar);
			}
			.web-scrollbar-sample::after {
				top: 31px;
				height: 18px;
				background: var(--scrollbar-hover);
			}
			.web-scrollbar-sample i {
				bottom: 5px;
				height: 17px;
				background: var(--scrollbar-active);
			}
			.web-card-header {
				display: flex;
				align-items: flex-start;
				justify-content: space-between;
				gap: 12px;
				padding: 16px 17px 12px;
			}
			.web-card-title {
				font-size: 14px;
				font-weight: 600;
			}
			.web-card-description {
				margin-top: 3px;
				color: var(--muted-foreground);
				font-size: 12px;
			}
			.box-table-head,
			.box-row {
				display: grid;
				grid-template-columns: minmax(130px, 1fr) 110px 130px 30px;
				align-items: center;
				gap: 10px;
				padding: 0 14px;
			}
			.box-table-head {
				height: 36px;
				border-bottom: 1px solid var(--border);
				font-size: 11px;
				font-weight: 600;
			}
			.box-row {
				height: 49px;
				border-bottom: 1px solid var(--border);
			}
			.box-row:last-child {
				border-bottom: 0;
			}
			.box-row:hover {
				background: var(--hover);
			}
			.box-name {
				font-weight: 600;
			}
			.web-status {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				font-size: 11px;
				font-weight: 600;
			}
			.web-status::before {
				width: 6px;
				height: 6px;
				border-radius: 50%;
				background: currentColor;
				content: "";
			}
			.web-success {
				color: var(--success);
			}
			.web-warning {
				color: var(--warning);
			}
			.web-danger {
				color: var(--destructive);
			}
			.web-info {
				color: var(--info);
			}
			.web-grid {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 12px;
			}
			.web-field {
				display: grid;
				gap: 5px;
			}
			.web-field label {
				font-size: 12px;
				font-weight: 600;
			}
			.web-field small {
				color: var(--muted-foreground);
			}
			.web-input {
				display: flex;
				height: 32px;
				align-items: center;
				padding: 0 11px;
				border: 1px solid var(--field-border);
				border-radius: 16px;
				background: var(--field);
				color: var(--field-foreground);
			}
			.web-input .icon {
				width: 13px;
				height: 13px;
				margin-left: auto;
			}
			.web-placeholder {
				color: var(--field-placeholder);
			}
			.web-input.focused {
				border-color: var(--ring);
				box-shadow: 0 0 0 1px var(--ring);
			}
			.web-muted-block {
				padding: 12px;
				border-radius: 12px;
				background: var(--muted);
				color: var(--muted-foreground);
			}
			.web-form-actions {
				display: flex;
				justify-content: flex-end;
				gap: 7px;
				margin-top: 15px;
			}
			.monitor-card {
				position: relative;
				height: 360px;
				padding: 14px;
			}
			.monitor-controls {
				position: relative;
				z-index: 2;
				display: flex;
				gap: 7px;
			}
			.monitor-select {
				display: inline-flex;
				height: 30px;
				align-items: center;
				gap: 18px;
				padding: 0 10px;
				border-radius: 15px;
				background: var(--secondary-button);
				color: var(--secondary-button-foreground);
				font-size: 11px;
			}
			.monitor-select .icon {
				width: 12px;
				height: 12px;
			}
			.monitor-select.badge-sample:hover {
				background: var(--badge-hover);
			}
			.metric-summary {
				position: absolute;
				top: 18px;
				right: 18px;
				text-align: right;
			}
			.metric-summary b {
				display: block;
				font-size: 19px;
			}
			.web-chart {
				position: absolute;
				inset: 68px 20px 24px;
				overflow: hidden;
				border-bottom: 1px solid var(--border);
				background: linear-gradient(var(--border) 1px, transparent 1px) 0 0/100%
					25%;
			}
			.web-chart svg {
				width: 100%;
				height: 100%;
				overflow: visible;
			}
			.chart-legend {
				position: absolute;
				right: 22px;
				bottom: 29px;
				display: flex;
				gap: 10px;
				color: var(--muted-foreground);
				font-size: 10px;
			}
			.chart-legend span::before {
				display: inline-block;
				width: 7px;
				height: 7px;
				margin-right: 4px;
				border-radius: 50%;
				background: currentColor;
				content: "";
			}
			.web-popover {
				position: absolute;
				top: 100px;
				right: 34px;
				z-index: 3;
				width: 205px;
				padding: 4px;
				border: 1px solid var(--border);
				border-radius: 16px;
				background: var(--popover);
				color: var(--popover-foreground);
				box-shadow: 0 12px 32px
					color-mix(in srgb, var(--overlay) 45%, transparent);
			}
			.web-menu-item {
				display: flex;
				min-height: 31px;
				align-items: center;
				gap: 8px;
				padding: 6px 9px;
				border-radius: 12px;
			}
			.web-menu-item.selected {
				background: var(--selected);
				color: var(--selected-foreground);
			}
			.web-menu-separator {
				height: 1px;
				margin: 4px -1px;
				background: var(--border);
			}
			.web-toast {
				position: absolute;
				right: 34px;
				bottom: 25px;
				z-index: 3;
				display: grid;
				width: 270px;
				grid-template-columns: 18px 1fr;
				gap: 9px;
				padding: 12px;
				border: 1px solid var(--border);
				border-radius: 10px;
				background: var(--popover);
				color: var(--popover-foreground);
				box-shadow: 0 6px 16px -4px
					color-mix(in srgb, var(--overlay) 35%, transparent);
			}
			.web-overlay {
				position: absolute;
				inset: 0;
				z-index: 5;
				display: grid;
				place-items: center;
				padding: 20px;
				background: var(--overlay);
			}
			.web-dialog {
				width: min(390px, 100%);
				padding: 20px;
				border: 1px solid var(--border);
				border-radius: 22px;
				background: var(--dialog);
				color: var(--dialog-foreground);
				box-shadow: 0 18px 46px
					color-mix(in srgb, var(--overlay) 70%, transparent);
			}
			.web-dialog h3 {
				margin: 0;
				font-size: 16px;
				font-weight: 600;
			}

			/* IDE: desktop Composery captures have a top menubar, horizontal
			   activity bar at the foot of Explorer, editor/terminal splits, and
			   no fabricated left activity rail. */
			.ide-product {
				display: grid;
				grid-template-rows: 35px minmax(0, 1fr) 21px;
				background: var(--ide-editor);
				color: var(--ide-foreground);
				font:
					12px/1.35 -apple-system,
					"Segoe UI",
					sans-serif;
			}
			.ide-product button {
				font: inherit;
			}
			.workbench-titlebar {
				display: grid;
				grid-template-columns: auto minmax(170px, 1fr) auto;
				align-items: center;
				gap: 18px;
				padding: 0 10px;
				border-bottom: 1px solid var(--ide-border);
				background: var(--ide-title-bar);
				color: var(--ide-title-bar-foreground);
			}
			.workbench-menus {
				display: flex;
				align-items: center;
				gap: 12px;
				white-space: nowrap;
			}
			.workbench-mark {
				width: 20px;
				height: 20px;
			}
			.workbench-command {
				width: min(430px, 100%);
				height: 25px;
				justify-self: center;
				padding: 3px 12px;
				border: 1px solid var(--ide-input-border);
				border-radius: 7px;
				color: var(--ide-title-bar-foreground);
				text-align: center;
			}
			.workbench-layout {
				display: flex;
				gap: 13px;
				font-size: 15px;
			}
			.workbench-layout .codicon {
				font-size: 15px;
			}
			.workbench-body {
				display: grid;
				grid-template-columns: 185px minmax(0, 1fr);
				min-height: 0;
			}
			.workbench-sidebar {
				display: grid;
				grid-template-rows: 36px minmax(0, 1fr) 40px;
				min-height: 0;
				border-right: 1px solid var(--ide-border);
				background: var(--ide-side-bar);
				color: var(--ide-foreground);
			}
			.explorer-title {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 0 11px;
				color: var(--ide-muted-foreground);
				font-size: 11px;
				text-transform: uppercase;
			}
			.explorer-title .codicon {
				font-size: 15px;
			}
			.explorer-tree {
				overflow: hidden;
			}
			.explorer-section {
				display: flex;
				align-items: center;
				gap: 4px;
				padding: 5px 9px;
				font-weight: 700;
			}
			.explorer-row {
				display: flex;
				height: 23px;
				align-items: center;
				gap: 5px;
				padding-right: 7px;
				white-space: nowrap;
			}
			.explorer-section .codicon,
			.explorer-row .codicon {
				flex: 0 0 auto;
				font-size: 14px;
			}
			.explorer-row:hover {
				background: var(--ide-list-hover);
			}
			.explorer-row.selected {
				background: var(--ide-list-selection);
				color: var(--ide-list-selection-foreground);
			}
			.explorer-row.selected {
				box-shadow: inset 2px 0 var(--ide-focus);
			}
			.explorer-row.ignored {
				color: var(--ide-ignored);
			}
			.explorer-decoration {
				margin-left: auto;
				font-weight: 700;
			}
			.workbench-activity {
				display: flex;
				align-items: center;
				gap: 15px;
				padding: 0 10px;
				border-top: 1px solid var(--ide-border);
				background: var(--ide-activity-bar);
				color: var(--ide-activity-bar-inactive);
				font-size: 17px;
			}
			.workbench-activity .active {
				color: var(--ide-foreground);
			}
			.feature-activity-bar-indicator .workbench-activity .active {
				box-shadow: inset 0 -2px var(--ide-focus);
			}
			.workbench-activity button {
				display: grid;
				height: 32px;
				place-items: center;
				padding: 0;
				border: 0;
				background: transparent;
				color: inherit;
				cursor: pointer;
				font-size: inherit;
			}
			.workbench-activity .codicon {
				font-size: 18px;
			}
			.workbench-content {
				min-width: 0;
				min-height: 0;
				overflow: hidden;
				background: var(--ide-editor);
			}
			.workbench-status {
				display: flex;
				align-items: center;
				gap: 13px;
				padding: 0 8px;
				border-top: 1px solid var(--ide-border);
				background: var(--ide-status-bar);
				color: var(--ide-status-bar-foreground);
				font-size: 11px;
			}
			.workbench-status .right {
				margin-left: auto;
			}
			.workbench-status > span:not(.right) {
				display: inline-flex;
				align-items: center;
				gap: 4px;
			}
			.workbench-status .codicon {
				font-size: 12px;
			}
			.ide-split {
				display: grid;
				height: 100%;
				grid-template-columns: 1.12fr 0.88fr;
			}
			.ide-pane {
				display: grid;
				min-width: 0;
				min-height: 0;
				grid-template-rows: 35px 1fr;
				background: var(--ide-editor);
			}
			.ide-pane + .ide-pane {
				border-left: 1px solid var(--ide-border);
			}
			.ide-tabs {
				display: flex;
				min-width: 0;
				border-bottom: 1px solid var(--ide-tab-border);
				background: var(--ide-tab-bar);
			}
			.ide-editor-tab {
				display: flex;
				height: 35px;
				align-items: center;
				gap: 7px;
				padding: 0 12px;
				border: 0;
				border-right: 1px solid var(--ide-tab-border);
				background: var(--ide-tab-inactive);
				color: var(--ide-tab-inactive-foreground);
				cursor: pointer;
			}
			.ide-editor-tab .codicon {
				font-size: 14px;
			}
			.ide-editor-tab.active {
				background: var(--ide-tab-active);
				color: var(--ide-tab-active-foreground);
			}
			.ide-editor-tab.hover-sample {
				background: var(--ide-tab-hover);
			}
			.feature-active-tab-indicator .ide-editor-tab.active {
				box-shadow: inset 0 1px var(--ide-focus);
			}
			.ide-document {
				min-height: 0;
				overflow: hidden;
				padding: 26px 34px;
				background: var(--ide-editor);
				color: var(--ide-foreground);
			}
			.ide-document h2 {
				margin: 0 0 13px;
				padding-bottom: 12px;
				border-bottom: 1px solid var(--ide-border);
				font-size: 27px;
			}
			.ide-document h3 {
				margin: 20px 0 9px;
				font-size: 15px;
			}
			.ide-document p,
			.ide-document li {
				font-size: 13px;
				line-height: 1.6;
			}
			.ide-document code {
				padding: 2px 4px;
				border-radius: 3px;
				background: var(--ide-selection);
			}
			.ide-terminal-pane {
				display: grid;
				min-height: 0;
				grid-template-rows: 35px 1fr;
				background: var(--ide-panel);
			}
			.ide-panel-title {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 0 11px;
				border-bottom: 1px solid var(--ide-border);
				color: var(--ide-foreground);
			}
			.ide-panel-actions {
				display: inline-flex;
				align-items: center;
				gap: 8px;
			}
			.ide-panel-actions .codicon {
				font-size: 14px;
			}
			.feature-panel-title-indicator .ide-panel-title span:first-child {
				align-self: stretch;
				padding-top: 10px;
				box-shadow: inset 0 -2px var(--ide-focus);
			}
			.ide-terminal {
				min-height: 0;
				overflow: hidden;
				padding: 14px;
				background: var(--ide-panel);
				color: var(--ide-foreground);
				font:
					12px/1.55 "Cascadia Mono",
					Consolas,
					monospace;
			}
			.ide-terminal .dim {
				color: var(--ide-muted-foreground);
			}
			.ide-editor-stack {
				display: grid;
				height: 100%;
				grid-template-rows: 35px 23px 1fr;
			}
			.ide-breadcrumbs {
				display: flex;
				align-items: center;
				gap: 6px;
				padding: 0 13px;
				background: var(--ide-breadcrumb);
				color: var(--ide-breadcrumb-foreground);
				font-size: 11px;
			}
			.ide-code {
				position: relative;
				display: grid;
				min-height: 0;
				grid-template-columns: minmax(0, 1fr) 68px;
				overflow: hidden;
				background: var(--ide-editor);
				color: var(--ide-foreground);
				font:
					12px/19px "Cascadia Mono",
					Consolas,
					monospace;
			}
			.code-scroll {
				position: relative;
				min-width: 0;
				padding: 8px 0;
			}
			.editor-ruler {
				position: absolute;
				top: 0;
				bottom: 0;
				left: 83%;
				width: 1px;
				background: var(--ide-ruler);
			}
			.editor-line {
				display: grid;
				min-height: 19px;
				grid-template-columns: 36px 5px 1fr;
			}
			.editor-line > span:last-child {
				overflow: hidden;
				white-space: nowrap;
			}
			.editor-line.current {
				background: var(--ide-list-hover);
			}
			.editor-number {
				padding-right: 8px;
				color: var(--ide-line-number);
				text-align: right;
			}
			.editor-line.current .editor-number {
				color: var(--ide-active-line-number);
			}
			.editor-gutter.added {
				background: var(--ide-gutter-added);
			}
			.editor-gutter.modified {
				background: var(--ide-gutter-modified);
			}
			.editor-gutter.deleted {
				background: var(--ide-gutter-deleted);
			}
			.indent-guide {
				display: inline-block;
				width: 17px;
				height: 16px;
				border-left: 1px solid var(--ide-indent-guide);
			}
			.indent-guide.active {
				border-left-color: var(--ide-active-indent-guide);
			}
			.editor-whitespace {
				color: var(--ide-whitespace);
			}
			.editor-selection {
				background: var(--ide-selection);
			}
			.editor-selection-highlight {
				background: var(--ide-selection-highlight);
			}
			.editor-word-highlight {
				background: var(--ide-word-highlight);
			}
			.editor-find {
				background: color-mix(in srgb, var(--ide-find-match) 65%, transparent);
			}
			.editor-find-highlight {
				background: var(--ide-find-match-highlight);
			}
			.editor-bracket {
				outline: 1px solid var(--ide-bracket-match);
			}
			.editor-cursor {
				display: inline-block;
				width: 2px;
				height: 15px;
				translate: 0 3px;
				background: var(--ide-cursor);
			}
			.ide-minimap {
				position: relative;
				padding: 9px 7px;
				border-left: 1px solid var(--ide-border);
			}
			.ide-minimap i {
				display: block;
				height: 2px;
				margin-bottom: 3px;
				border-radius: 1px;
				background: currentColor;
				opacity: 0.75;
			}
			.scrollbar-samples {
				position: absolute;
				top: 7px;
				right: 2px;
				display: flex;
				gap: 2px;
			}
			.scrollbar-samples i {
				width: 5px;
				height: 42px;
				border-radius: 4px;
				opacity: 1;
			}
			.scrollbar-normal {
				background: var(--ide-scrollbar) !important;
			}
			.scrollbar-hover {
				background: var(--ide-scrollbar-hover) !important;
			}
			.scrollbar-active {
				background: var(--ide-scrollbar-active) !important;
			}
			.syn-keyword {
				color: var(--ide-keyword);
			}
			.syn-operator {
				color: var(--ide-operator);
			}
			.syn-string {
				color: var(--ide-string);
			}
			.syn-escape {
				color: var(--ide-escape);
			}
			.syn-regex {
				color: var(--ide-regex);
			}
			.syn-number {
				color: var(--ide-number);
			}
			.syn-function {
				color: var(--ide-function);
			}
			.syn-decorator {
				color: var(--ide-decorator);
			}
			.syn-type {
				color: var(--ide-type);
			}
			.syn-namespace {

		<script>
			// The palette arrives over the network; without this the first frame is
			// the browser's white canvas. Remembered alongside the session state.
			window.COLORS_STORE = "composery-colors";
			try {
				const last = JSON.parse(
					localStorage.getItem(window.COLORS_STORE) ?? "{}"
				);
				const root = document.documentElement;
				root.style.colorScheme = last.scheme === "dark" ? "dark" : "light";
				for (const [name, value] of Object.entries(last.vars ?? {}))
					root.style.setProperty(name, value);
				// Exactly the properties the last paint set, so the chrome does not
				// reflow once the real palette lands.

				if (!last.vars) {
					root.style.setProperty("--background", "#ffffff");
					root.style.setProperty("--foreground", "#000000");
				}
			} catch {}
		</script>

			function lucide(name) {
				const svg = document.createElementNS(
					"http://www.w3.org/2000/svg",
					"svg"
				);
				svg.classList.add("icon");
				svg.setAttribute("aria-hidden", "true");
				const use = document.createElementNS(
					"http://www.w3.org/2000/svg",
					"use"
				);
				use.setAttribute("href", `/lucide.svg#${name}`);
				svg.append(use);
				return svg;
			}

			function setIcon(button, name, count) {
				button.replaceChildren(lucide(name));
				if (!count) return;
				const badge = document.createElement("span");
				badge.className = "link-count";
				badge.textContent = count;
				button.append(badge);
			}

			function setPressed(container, selected) {
				for (const button of container.querySelectorAll("button"))
					button.setAttribute(
						"aria-pressed",
						String(button.dataset.value === selected)
					);
			}

			// Pasted colours arrive with quotes, semicolons, 0x, or no hash at all.
			function normalize(value) {
				const digits = value
					.trim()
					.toLowerCase()
					.replace(/[\s"'`;,]/g, "")
					.replace(/^(?:#|0x)+/, "");
				if (!/^[0-9a-f]+$/.test(digits)) return null;
				if (digits.length === 3 || digits.length === 4)
					return `#${[...digits].map((character) => character + character).join("")}`;
				return digits.length === 6 || digits.length === 8 ? `#${digits}` : null;
			}

			function toHsv(hex) {
				const [red, green, blue] = [1, 3, 5].map(
					(index) => parseInt(hex.slice(index, index + 2), 16) / 255
				);
				const value = Math.max(red, green, blue);
				const span = value - Math.min(red, green, blue);
				const hue =
					span === 0
						? 0
						: value === red
							? (green - blue) / span + (green < blue ? 6 : 0)
							: value === green
								? (blue - red) / span + 2
								: (red - green) / span + 4;
				return [hue * 60, value === 0 ? 0 : span / value, value];
			}

			function toHex([hue, saturation, value]) {
				const channel = (offset) => {
					const k = (offset + hue / 60) % 6;
					const c =
						value * (1 - saturation * Math.max(0, Math.min(k, 4 - k, 1)));
					return Math.round(c * 255)
						.toString(16)
						.padStart(2, "0");
				};
				return `#${channel(5)}${channel(3)}${channel(1)}`;
			}

			const picker = document.querySelector("#picker");
			const sv = picker.querySelector(".sv");
			const knob = picker.querySelector(".sv i");
			const hue = picker.querySelector(".hue");
			const alpha = picker.querySelector(".alpha");
			const hexField = picker.querySelector(".hex");
			let hsv = [0, 0, 0];
			let emit = () => {};

			// The hue rail comes from the same conversion the picker writes with.
			hue.style.background = `linear-gradient(to right, ${[
				0, 60, 120, 180, 240, 300, 360
			]
				.map((degrees) => toHex([degrees, 1, 1]))
				.join(", ")})`;

			function refreshPicker() {
				const base = toHex([hsv[0], 1, 1]);
				const hex = toHex(hsv);
				sv.style.background = `linear-gradient(to top, #000, #0000), linear-gradient(to right, #fff, #fff0), ${base}`;
				knob.style.left = `${hsv[1] * 100}%`;
				knob.style.top = `${(1 - hsv[2]) * 100}%`;
				knob.style.background = hex;
				alpha.style.background = `linear-gradient(to right, ${hex}00, ${hex}), repeating-conic-gradient(#737373 0 25%, #262626 0 50%) 0 0/12px 12px`;
			}

			function emitPicker() {
				const suffix =
					Number(alpha.value) === 255
						? ""
						: Number(alpha.value).toString(16).padStart(2, "0");
				const next = toHex(hsv) + suffix;
				hexField.value = next;
				refreshPicker();
				emit(next);
			}

			function openPicker(anchor, current, onChange) {
				hsv = toHsv(current);
				hue.value = String(Math.round(hsv[0]));
				alpha.value = String(
					current.length === 9 ? parseInt(current.slice(7), 16) : 255
				);
				hexField.value = current;
				emit = onChange;
				refreshPicker();
				picker.showPopover();
				const box = anchor.getBoundingClientRect();
				picker.style.left = `${Math.min(box.left, innerWidth - 280)}px`;
				picker.style.top = `${Math.min(box.bottom + 6, innerHeight - 300)}px`;
			}

			sv.onpointerdown = (event) => {
				sv.setPointerCapture(event.pointerId);
				const track = ({ clientX, clientY }) => {
					const box = sv.getBoundingClientRect();
					const clamp = (value) => Math.min(1, Math.max(0, value));
					hsv = [
						hsv[0],
						clamp((clientX - box.left) / box.width),
						1 - clamp((clientY - box.top) / box.height)
					];
					emitPicker();
				};
				sv.onpointermove = track;
				track(event);
			};
			sv.onpointerup = () => (sv.onpointermove = null);
			// The picker is anchored on open, so scrolling it out from under is a dismissal.
			roles.parentElement.onscroll = () => picker.hidePopover();
			picker.addEventListener("toggle", (event) => {
				if (event.newState === "closed") settle();
			});
			hue.oninput = () => {
				hsv = [Number(hue.value), hsv[1], hsv[2]];
				emitPicker();
			};
			alpha.oninput = emitPicker;
			hexField.oninput = () => {
				const next = normalize(hexField.value);
				hexField.classList.toggle("invalid", !next);
				if (!next) return;
				hsv = toHsv(next);
				hue.value = String(Math.round(hsv[0]));
				alpha.value = String(
					next.length === 9 ? parseInt(next.slice(7), 16) : 255
				);
				refreshPicker();
				emit(next);
			};

			// Roles holding the same value in this scheme move together, unless the
			// user has detached one to give it a life of its own.
			function linkedRoles(source, key) {
				if (detached.has(`${source}.${key}`)) return [[source, key]];
				const value = theme[source][scheme][key];
				const found = [];
				for (const area of ["web", "ide"])
					for (const [name, current] of Object.entries(theme[area][scheme]))
						if (current === value && !detached.has(`${area}.${name}`))
							found.push([area, name]);
				return found;
			}

			// Painted on the root, so the editor wears the scheme it is editing.
			function paint() {
				const root = document.documentElement;
				root.style.colorScheme = scheme;
				painted = {};
				for (const [prefix, values] of [
					["-", theme.web[scheme]],
					["-ide-", theme.ide[scheme]]
				])
					for (const [key, value] of Object.entries(values))
						painted[
							`-${prefix}${key.replace(/[A-Z]/g, (letter) => `-${letter.toLowerCase()}`)}`
						] = value;
				for (const [name, value] of Object.entries(painted))
					root.style.setProperty(name, value);
				const idePreview = stage.querySelector(".ide-product");
				if (idePreview)
					for (const [key, enabled] of Object.entries(theme.ide.features))
						idePreview.classList.toggle(
							`feature-${key.replace(/[A-Z]/g, (letter) => `-${letter.toLowerCase()}`)}`,
							enabled
						);
				seen.clear();
				for (const section of sections) section.visible = 0;

				for (const refresh of rows) refresh();
				for (const section of sections)
					section.group.hidden = section.visible === 0;
				remember();
				undoButton.disabled = history.length === 0;
				redoButton.disabled = future.length === 0;
				undoButton.title = history.length
					? `Undo ${history.at(-1).label} (Ctrl+Z)`
					: "Nothing to undo";
				redoButton.title = future.length
					? `Redo ${future.at(-1).label} (Ctrl+Y)`
					: "Nothing to redo";
				resetAllButton.disabled =
					JSON.stringify(theme) === JSON.stringify(saved);
			}

			function renderControls() {
				roles.replaceChildren();
				rows.length = 0;
				sections.length = 0;
				const featureGroup = document.createElement("section");
				featureGroup.className = "group";
				const featureHeading = document.createElement("h2");
				featureHeading.textContent = "VS Code theme options";
				featureGroup.append(featureHeading);
				const featureTally = { group: featureGroup, visible: 0 };
				sections.push(featureTally);
				for (const [key, label, description] of FEATURES) {
					const row = document.createElement("label");
					row.className = "feature-row";
					row.dataset.feature = key;
					const copy = document.createElement("span");
					copy.className = "feature-copy";
					const name = document.createElement("b");
					name.textContent = label;
					const detail = document.createElement("small");
					detail.textContent = description;
					copy.append(name, detail);
					const toggle = document.createElement("input");
					toggle.type = "checkbox";
					toggle.className = "feature-switch";
					toggle.setAttribute("aria-label", label);
					toggle.onchange = () => {
						if (theme.ide.features[key] === toggle.checked) return;
						settle();
						startEdit(label);
						commitOnce();
						theme.ide.features[key] = toggle.checked;
						paint();
					};
					rows.push(() => {
						toggle.checked = theme.ide.features[key];
						row.hidden = area !== "ide";
						if (!row.hidden) featureTally.visible += 1;
					});
					row.append(copy, toggle);
					featureGroup.append(row);
				}
				roles.append(featureGroup);
				for (const [title, entries] of GROUPS) {
					const group = document.createElement("section");
					group.className = "group";
					const heading = document.createElement("h2");
					heading.textContent = title;
					group.append(heading);
					const tally = { group, visible: 0 };
					sections.push(tally);
					for (const [source, key, label] of entries) {
						labels.set(`${source}.${key}`, label);
						const row = document.createElement("div");
						row.className = "role";
						const name = document.createElement("button");
						name.type = "button";
						name.className = "role-name";
						name.title = label;
						name.textContent = label;
						const tag = document.createElement("b");
						tag.className = "area";
						tag.textContent = source;
						const swatch = document.createElement("button");
						swatch.type = "button";
						swatch.className = "swatch";
						swatch.setAttribute("aria-label", `${label} color picker`);
						const text = document.createElement("input");
						text.type = "text";
						text.spellcheck = false;
						text.setAttribute("aria-label", `${label} hex color`);
						const link = document.createElement("button");
						link.type = "button";
						link.className = "link icon-only";
						const reset = document.createElement("button");
						reset.type = "button";
						reset.className = "reset icon-only";
						setIcon(reset, "rotate-ccw");
						reset.title = "Reset this colour and everything linked to it";
						const id = `${source}.${key}`;
						row.dataset.role = id;
						const current = () => theme[source][scheme][key];
						const refresh = () => {
							const value = current();
							swatch.style.background = `linear-gradient(${value}, ${value}), repeating-conic-gradient(#737373 0 25%, #262626 0 50%) 0 0/8px 8px`;
							if (document.activeElement !== text) {
								text.value = value;
								text.classList.remove("invalid");
							}
							const loose = detached.has(id);
							const shared = linkedRoles(source, key);
							setIcon(
								link,
								loose ? "unlink-2" : "link-2",
								shared.length > 1 ? String(shared.length) : ""
							);
							link.classList.toggle("loose", loose);
							link.title = loose
								? "Detached - edits here move nothing else. Click to link it back up."
								: shared.length > 1
									? `Linked with ${shared
											.filter((role) => `${role[0]}.${role[1]}` !== id)
											.map((role) => labels.get(role.join(".")))
											.join(", ")}. Click to detach this one.`
									: "Nothing else holds this value. Click to keep it that way.";
							reset.disabled = shared.every(
								([peerSource, peerKey]) =>
									theme[peerSource][scheme][peerKey] ===
									saved[peerSource][scheme][peerKey]
							);
							// "Hide linked" keeps the first row of each group of equal values,
							// counted over the rows the surface filter is letting through.
							const elsewhere = onlyArea && !surfaceTokens.get(area).has(id);
							let first = false;
							if (!elsewhere) {
								first = loose || !seen.has(value);
								if (!loose) seen.add(value);
							}
							row.hidden = elsewhere || (hideLinked && !first);
							if (!row.hidden) tally.visible += 1;
						};
						rows.push(refresh);
						name.onclick = () => revealToken(id);
						// An edit that changes nothing must not land in the history.
						const update = (next) => {
							if (
								editing.every(
									([peerSource, peerKey]) =>
										theme[peerSource][scheme][peerKey] === next
								)
							)
								return;
							commitOnce();
							for (const [peerSource, peerKey] of editing)
								theme[peerSource][scheme][peerKey] = next;
							paint();
						};
						const startOn = (peers) => {
							settle();
							editing = peers;
							startEdit(
								peers.length > 1
									? `${label} and ${peers.length - 1} linked`
									: label
							);
						};
						swatch.onclick = () => {
							revealToken(id);
							startOn(linkedRoles(source, key));
							openPicker(swatch, current(), update);
						};
						text.onfocus = () => {
							revealToken(id);
							startOn(linkedRoles(source, key));
						};
						text.onblur = settle;
						link.onclick = () => {
							if (detached.has(id)) detached.delete(id);
							else detached.add(id);
							remember();
							paint();
						};
						reset.onclick = () => {
							const peers = linkedRoles(source, key);
							if (
								peers.every(
									([peerSource, peerKey]) =>
										theme[peerSource][scheme][peerKey] ===
										saved[peerSource][scheme][peerKey]
								)
							)
								return;
							settle();
							startEdit(`reset ${label}`);
							commitOnce();
							for (const [peerSource, peerKey] of peers)
								theme[peerSource][scheme][peerKey] =
									saved[peerSource][scheme][peerKey];
							paint();
						};
						text.oninput = () => {
							const next = normalize(text.value);
							text.classList.toggle("invalid", !next);
							if (next) update(next);
						};
						text.onchange = () => {
							const next = normalize(text.value);
							text.value = next ?? current();
							text.classList.remove("invalid");
						};
						row.append(name, tag, swatch, text, link, reset);
						group.append(row);
					}
					roles.append(group);
				}
			}

			const statesFor = (surface) =>
				previewStates
					.filter((template) => template.dataset.surface === surface)
					.toSorted(
						(first, second) =>
							Number(first.dataset.order ?? 0) -
							Number(second.dataset.order ?? 0)
					);
			const containsToken = (template, token) =>
				tokenSet(template.content).has(token);

			function stateForToken(surface, token) {
				const shell = previewShells.get(surface);
				if (shell && containsToken(shell, token)) return views[surface];
				return statesFor(surface).find((template) =>
					containsToken(template, token)
				)?.dataset.view;
			}

			function highlightToken() {
				for (const row of roles.querySelectorAll(".role"))
					row.classList.toggle("active", row.dataset.role === activeToken);
				for (const element of stage.querySelectorAll("[data-token]"))
					element.classList.toggle(
						"token-hit",
						activeToken !== null &&
							element.dataset.token.split(/\s+/).includes(activeToken)
					);
			}

			function revealToken(token) {
				activeToken = token;
				let nextView = stateForToken(area, token);
				if (!nextView) {
					const source = token.split(".")[0];
					const preferred = source === "ide" ? ["ide"] : ["web", "ide"];
					area =
						preferred.find((surface) => stateForToken(surface, token)) ?? area;
					nextView = stateForToken(area, token);
				}
				if (nextView) views[area] = nextView;
				render();
			}

			function previewSummary() {
				const tokens = surfaceTokens.get(area);
				const web = [...tokens].filter((token) => token.startsWith("web."));
				const ide = [...tokens].filter((token) => token.startsWith("ide."));
				if (area === "ide")
					return `${ide.length} IDE roles Â· ${FEATURES.length} theme options Â· ${web.length} shared status roles`;
				return `${web.length} web roles Â· every role has a reference state`;
			}

			function render() {
				picker.hidePopover();
				const states = statesFor(area);
				if (!states.some((template) => template.dataset.view === views[area]))
					views[area] = states[0].dataset.view;

				const bar = document.createElement("div");
				bar.className = "preview-bar";
				const tabs = document.createElement("div");
				tabs.className = "preview-tabs";
				tabs.setAttribute("aria-label", `${area} reference state`);
				for (const template of states) {
					const button = document.createElement("button");
					button.type = "button";
					button.dataset.goView = template.dataset.view;
					button.textContent = template.dataset.label;
					button.setAttribute(
						"aria-pressed",
						String(template.dataset.view === views[area])
					);
					tabs.append(button);
				}
				const summary = document.createElement("div");
				summary.className = "preview-summary";
				summary.textContent = previewSummary();
				bar.append(tabs, summary);

				const frame = document.createElement("div");
				frame.className = "preview-frame";
				const shell = previewShells
					.get(area)
					.content.firstElementChild.cloneNode(true);
				const state = states.find(
					(template) => template.dataset.view === views[area]
				);
				shell
					.querySelector("[data-preview-slot]")
					.replaceChildren(state.content.cloneNode(true));
				for (const button of shell.querySelectorAll("[data-go-view]"))
					button.classList.toggle(
						"current",
						button.dataset.goView === views[area]
					);
				frame.append(shell);
				stage.replaceChildren(bar, frame);
				paint();
				highlightToken();
				setPressed(document.querySelector("#area"), area);
				setPressed(document.querySelector("#scheme"), scheme);
			}

			stage.onclick = (event) => {
				const button = event.target.closest("[data-go-view]");
				if (!button) return;
				const next = button.dataset.goView;
				if (!statesFor(area).some((template) => template.dataset.view === next))
					return;
				views[area] = next;
				activeToken = null;
				render();
			};

			document.querySelector("#area").onclick = (event) => {
				const button = event.target.closest("button[data-value]");
				if (!button) return;
				area = button.dataset.value;
				remember();
				render();
			};
			document.querySelector("#scheme").onclick = (event) => {
				const button = event.target.closest("button[data-value]");
				if (!button) return;
				scheme = button.dataset.value;
				remember();
				render();
			};
			document.querySelector("#save").onclick = async () => {
				const save = document.querySelector("#save");
				save.disabled = true;
				status.className = "";
				status.textContent = "Savingâ€¦";
				const response = await fetch("/theme", {
					method: "PUT",
					headers: { "content-type": "application/json" },
					body: JSON.stringify(theme)
				});
				if (response.ok) saved = structuredClone(theme);
				status.textContent = response.ok
					? "Saved and regenerated."
					: await response.text();
				status.className = response.ok ? "" : "error";
				save.disabled = false;
				paint();
			};
			const hideLinkedBox = document.querySelector("#hide-linked");
			const onlyAreaBox = document.querySelector("#only-area");
			hideLinkedBox.checked = hideLinked;
			onlyAreaBox.checked = onlyArea;
			hideLinkedBox.onchange = (event) => {
				hideLinked = event.target.checked;
				remember();
				paint();
			};
			onlyAreaBox.onchange = (event) => {
				onlyArea = event.target.checked;
				remember();
				paint();
			};

			resetAllButton.onclick = () => {
				if (JSON.stringify(theme) === JSON.stringify(saved)) return;
				settle();
				startEdit("reset all");
				commitOnce();
				apply(saved);
				paint();
			};

			// The transfer text is exactly what a save writes to theme.json.
			const transfer = document.querySelector("#transfer");
			const transferText = document.querySelector("#transfer-text");
			const transferStatus = document.querySelector("#transfer-status");
			const say = (message, bad) => {
				transferStatus.textContent = message;
				transferStatus.className = bad ? "error" : "";
			};

			function readTransfer(text) {
				const next = JSON.parse(text);
				const clean = { web: {}, ide: { features: {} } };
				const featureKeys = Object.keys(theme.ide.features);
				if (
					!next?.ide?.features ||
					Object.keys(next.ide.features).length !== featureKeys.length
				)
					throw new Error("ide.features does not list every theme option");
				for (const key of featureKeys) {
					if (typeof next.ide.features[key] !== "boolean")
						throw new Error(`ide.features.${key} is not a boolean`);
					clean.ide.features[key] = next.ide.features[key];
				}
				for (const source of ["web", "ide"])
					for (const values of ["light", "dark"]) {
						const from = next?.[source]?.[values];
						const keys = Object.keys(theme[source][values]);
						if (!from || Object.keys(from).length !== keys.length)
							throw new Error(`${source}.${values} does not list every role`);
						clean[source][values] = {};
						for (const key of keys) {
							const value = normalize(String(from[key] ?? ""));
							if (!value)
								throw new Error(`${source}.${values}.${key} is not a colour`);
							clean[source][values][key] = value;
						}
					}
				return clean;
			}

			const applyButton = document.querySelector("#transfer-apply");

			// Apply stays off until the text is both readable and different.
			function reviewTransfer() {
				let next;
				try {
					next = readTransfer(transferText.value);
				} catch (error) {
					applyButton.disabled = true;
					say(String(error?.message ?? error), true);
					return null;
				}
				const same = JSON.stringify(next) === JSON.stringify(theme);
				applyButton.disabled = same;
				say(
					same
						? "Unchanged - select all to copy it out, or paste a set over it."
						: "Ready to apply."
				);
				return same ? null : next;
			}

			document.querySelector("#transfer-open").onclick = () => {
				transferText.value = `${JSON.stringify(theme, null, "\t")}\n`;
				reviewTransfer();
				transfer.showModal();
				transferText.select();
			};
			document.querySelector("#transfer-close").onclick = () =>
				transfer.close();
			transferText.oninput = reviewTransfer;
			applyButton.onclick = () => {
				const next = reviewTransfer();
				if (!next) return;
				settle();
				startEdit("import");
				commitOnce();
				apply(next);
				paint();
				transfer.close();
			};
			renderControls();
			render();
		</script>
	</body>
</html>
