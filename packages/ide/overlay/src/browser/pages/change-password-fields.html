<div class="auth-head">
  <div class="auth-crumbs">
    <button class="crumb" data-crumb="0" type="button">Current</button>
    <span class="crumb-separator" data-crumb="1" aria-hidden="true" hidden>/</span>
    <button class="crumb" data-crumb="1" type="button" hidden>New</button>
    <span class="crumb-separator" data-crumb="2" aria-hidden="true" hidden>/</span>
    <button class="crumb" data-crumb="2" type="button" hidden>Confirm</button>
  </div>
  <div class="auth-status" data-status aria-live="polite">{{ERROR}}</div>
</div>
<div class="auth-fields">
  <div
    class="auth-stage"
    data-stage
    data-button="Continue"
    data-verify="{{BASE}}/change-password/verify"
    data-verify-field="currentPassword"
  >
    <label class="sr-only" for="current-password">Current password</label>
    <input
      class="auth-input"
      id="current-password"
      name="currentPassword"
      type="password"
      placeholder="Current password"
      autocomplete="current-password"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      autofocus
      required
    />
  </div>
  <div class="auth-stage" data-stage data-button="Continue" hidden>
    <label class="sr-only" for="new-password">New password</label>
    <input
      class="auth-input"
      id="new-password"
      name="newPassword"
      type="password"
      placeholder="New password"
      autocomplete="new-password"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      data-password-input
      required
    />
  </div>
  <div class="auth-stage" data-stage data-button="Change password" hidden>
    <label class="sr-only" for="confirm-password">Confirm password</label>
    <input
      class="auth-input"
      id="confirm-password"
      name="confirmPassword"
      type="password"
      placeholder="Confirm password"
      autocomplete="new-password"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      data-password-confirm
      required
    />
  </div>
</div>
<button class="submit-button" type="submit">
  <svg
    class="submit-icon"
    width="16"
    height="16"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
    focusable="false"
  >
    <path class="submit-arrow-shaft" d="M5 12h14" />
    <path class="submit-arrow-head" d="m12 5 7 7-7 7" />
  </svg>
  <span>Continue</span>
</button>
{{FORGOT_PASSWORD_LINK}} {{SIGN_IN_LINK}}
